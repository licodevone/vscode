# ACME BR IDE: project-scoped configuration.
# Personal settings may be added outside the managed block.

# BEGIN ACMEBR MANAGED MCP
# Source: .mcp.json. Run pnpm agent:sync after editing.

[mcp_servers."context7"]
url = "https://mcp.context7.com/mcp"

[mcp_servers."serena"]
command = ".tmp/uv/bin/uvx.exe"
args = ["--python","3.13","--from","git+https://github.com/oraios/serena","serena","start-mcp-server","--project-from-cwd","--context","ide-assistant","--mode","interactive","--open-web-dashboard","false"]
startup_timeout_sec = 60

[mcp_servers."openaiDeveloperDocs"]
url = "https://developers.openai.com/mcp"

[mcp_servers."playwright"]
command = "pnpm"
args = ["dlx","@playwright/mcp@0.0.86","--headless","--isolated","--browser","msedge","--caps","devtools","--output-dir",".agent-validation/playwright"]
startup_timeout_sec = 60

[mcp_servers."component-explorer"]
command = "npm"
args = ["exec","--no","--","component-explorer","mcp","-p","./test/componentFixtures/component-explorer.json","--use-daemon","-vv"]
startup_timeout_sec = 60
# END ACMEBR MANAGED MCP
